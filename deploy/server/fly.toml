# Fly.io 설정: Fly가 앞에서 TLS를 맡아 wss://<app>.fly.dev 로 받고, 안쪽 8910(ws)으로 넘긴다.
# app 이름은 처음 배포할 때 바꿔도 된다 (그러면 online.json의 server_url_web도 같이 바꾼다).
app = "gyeolsa-server"
primary_region = "nrt"   # 도쿄 (한국에서 가까움)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8910
  force_https = true
  auto_stop_machines = "off"     # 웹소켓 연결이 길어서 늘 켜 둔다
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
